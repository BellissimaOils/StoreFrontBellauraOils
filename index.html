<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />

    <!-- Tab icon: white "B" on the brand purple (#8854c0).
         The site previously shipped no icon at all, so browsers fell back to
         requesting /favicon.ico, which had no file to match and was answered by
         the SPA catch-all with HTML — not parseable as an image, hence a blank
         tab. All four files live in public/ and Vite copies them to dist/ root.

         Three declarations on purpose, smallest-support-first:
           favicon.ico  legacy browsers, and it means the browser's implicit
                        /favicon.ico request hits a real file instead of HTML
           favicon.svg  modern browsers — one vector, sharp at every size
                        and on any future high-DPI display
           apple-touch-icon.png  iOS, which supports neither SVG favicons nor
                        .ico. Deliberately a full-bleed square: iOS applies its
                        own rounded mask and renders transparent corners black,
                        so this one file is NOT the rounded variant. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Default Social Preview (WhatsApp, Facebook, Twitter) - Home Hero Image -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bellaura Oils" />
    <meta property="og:title" content="Bellaura Oils | زيوت طبيعية فاخرة للعناية بالبشرة والشعر" />
    <meta property="og:description" content="اكتشف نقاء الزيوت الطبيعية المعصورة على البارد من Bellaura Oils للعناية الفائقة بالبشرة والشعر." />
    <meta property="og:image" content="https://pub-584126fe09324e178d68a3f2461340ea.r2.dev/Images/HomeImages/home.jpg" />
    <meta property="og:image:secure_url" content="https://pub-584126fe09324e178d68a3f2461340ea.r2.dev/Images/HomeImages/home.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://pub-584126fe09324e178d68a3f2461340ea.r2.dev/Images/HomeImages/home.jpg" />

    
    <!-- No hero preload. This used to preload
         /BackgroundPictures/hero_naissance_banner_v2_1779106857286.png, but
         public/BackgroundPictures/ does not exist in the repo, so the file is
         not in the build and the request 404s: a wasted round-trip on every
         page load plus a console warning, and it preloaded nothing. The real
         hero comes from homepage_sections.image_url, whose URL isn't known
         until that data loads.
         If a fixed hero file is added to public/, reinstate the preload. -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" /></noscript>
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://clerk.accounts.dev" />
    <link rel="preconnect" href="https://clerk.accounts.dev" crossorigin />
    <link rel="dns-prefetch" href="https://pub-f1cb75e5fb2046429b9f7a7d4a4b4bb2.r2.dev" />
    <link rel="preconnect" href="https://pub-f1cb75e5fb2046429b9f7a7d4a4b4bb2.r2.dev" crossorigin />
    <!-- The server replaces this per route before sending the HTML, so it is
         only ever seen if that injection is skipped. It is deliberately the
         ARABIC default: LanguageContext starts in Arabic, so this matches what
         the browser would render and nothing changes in the tab. It used to be
         the English string, which is what appeared and then switched.
         This file is emitted as dist/app.html, not dist/index.html — see
         scripts/postbuild-html.mjs for why that matters. -->
    <title>Bellaura Oils | زيوت طبيعية فاخرة للعناية بالبشرة والشعر</title>
    
    <!-- Critical CSS inline for above-the-fold content -->
    <style>
      /* Very light purple, kept in sync with --color-background-lilac in
         src/index.css. Must stay a literal hex here: this is inline
         critical CSS that renders before the Tailwind bundle loads, so it
         cannot reference the theme token. Previously #f7ede2 (beige),
         which flashed off-brand before hydration. */
      body { margin: 0; background-color: #f4ecfb; font-family: sans-serif; }
      #root { display: block; }
      .hero-placeholder { width: 100%; height: 50vh; background-color: #f4ecfb; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Defer all non-critical JS -->
    <script type="module" src="/src/main.tsx" defer></script>
  </body>
</html>
